[package]
name = "aura-plugin-lumina"
version = "0.1.0"
edition = "2021"

[features]
default = []
raylib = ["dep:raylib", "dep:fontdue"]
# Explicit opt-in for local Xvfb/CI diagnostics; not enabled in release builds.
lumina-diagnostics = ["raylib"]

[dependencies]
aura-nexus = { path = "../aura-nexus" }
raylib = { version = "5.5.1", optional = true }
# TrueType indexed glyph bitmaps for Opt-in OpenType shaped GPU atlas.
fontdue = { version = "=0.9.4", optional = true }
# UAX #29 extended grapheme clusters for safe TextInput cursor/editing.
unicode-segmentation = "=1.12.0"
# Real UAX #9 analysis and OpenType shaping; no GPU glyph-ID atlas yet.
unicode-bidi = "=0.3.18"
rustybuzz = "=0.20.1"
