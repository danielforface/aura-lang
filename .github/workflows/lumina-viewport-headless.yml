name: Lumina headless viewport and layout regressions

on:
  push:
    branches:
      - 'qual/ui-*'
    paths:
      - 'aura-plugin-lumina/**'
      - '.github/workflows/lumina-viewport-headless.yml'
      - 'docs/qualification/**'
  pull_request:
    paths:
      - 'aura-plugin-lumina/**'
      - '.github/workflows/lumina-viewport-headless.yml'

permissions:
  contents: read

jobs:
  viewport-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Rust test (no GUI, no Z3, no persistent cache)
        run: cargo test --locked -p aura-plugin-lumina --no-default-features

  raylib-feature-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install raylib native Linux compile prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libasound2-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev
      - name: Compile Raylib feature (compile-only; no GUI claims)
        run: cargo check --locked -p aura-plugin-lumina --features raylib

  raylib-xvfb-window-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install software-display and native Raylib prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool cmake pkg-config libasound2-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libgl1-mesa-dri fonts-dejavu-core fonts-linuxlibertine libibus-1.0-dev ibus ibus-hangul fonts-nanum fonts-wqy-microhei ibus-libpinyin dbus-x11
      - name: Raylib-enabled library unit tests including typed IBus keysym and protocol bounds
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib --lib

      - name: Actual live IBus Hangul preedit/commit and typed XTest press/release/Shift
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          IBUS_USE_PORTAL: "0"
        run: |
          bash aura-plugin-lumina/scripts/build-ibus-helper.sh "$RUNNER_TEMP/lumina-ibus-helper"
          xvfb-run -a -s "-screen 0 1280x960x24" dbus-run-session -- bash -ec '
            ibus-daemon --daemonize --xim --panel disable
            gsettings set org.freedesktop.ibus.engine.hangul initial-input-mode "latin"
            gsettings set org.freedesktop.ibus.engine.hangul switch-keys "Hangul"
            gsettings set org.freedesktop.ibus.general use-global-engine true
            sleep 1
            echo "LUMINA_IBUS_REGISTERED_ENGINES:"
            ibus list-engine | head -65
            echo "LUMINA_IBUS_REQUEST_ENGINE:"
            ibus engine hangul
            ibus engine
            sleep 1
            export LUMINA_IBUS_HELPER_BIN="$RUNNER_TEMP/lumina-ibus-helper"
            export LUMINA_IBUS_ENGINE="hangul"
            export LUMINA_IBUS_TEST_HANGUL_SWITCH="1"
            cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test ibus_native_e2e -- --nocapture --test-threads=1
            cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test ibus_input_semantics_e2e -- --nocapture --test-threads=1
            echo "LUMINA_IBUS_SELECT_CANDIDATE_ENGINE"
            unset LUMINA_IBUS_TEST_HANGUL_SWITCH
            ibus engine libpinyin
            echo "LUMINA_IBUS_ACTIVE_CANDIDATE_ENGINE=$(ibus engine)"
            export LUMINA_IBUS_ENGINE="libpinyin"
            cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test ibus_candidate_e2e -- --nocapture --test-threads=1
          '

      - name: Render a real native window under Xvfb (no interactive/UI qualification claims)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib --test window_smoke -- --nocapture --test-threads=1
      - name: Native resized framebuffer pixel sampling (three sizes, clip + shader)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test pixel_resize_e2e -- --nocapture --test-threads=1
      - name: Real XTest pointer event dispatch and overflow clipping under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test mouse_e2e -- --nocapture --test-threads=1
      - name: Real XTest TextInput keyboard, focus, edit and submit event contract
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test keyboard_e2e -- --nocapture --test-threads=1
      - name: Real X11 Tab and Shift-Tab traversal skips clipped and disabled controls
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test tab_focus_e2e -- --nocapture --test-threads=1
      - name: Real X11 persisted drafts and Ctrl+A/Z/Y selection undo/rebase
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test edit_session_e2e -- --nocapture --test-threads=1
      - name: Native X11 delayed controlled prop echo and versioned authority contract
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test text_revision_e2e -- --nocapture --test-threads=1
      - name: Native measured-font caret, horizontal scroll and actual GPU clipped text
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test text_viewport_e2e -- --nocapture --test-threads=1
      - name: Actual external TTF Unicode Hebrew glyph atlas and real GPU framebuffer XTest
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test unicode_font_e2e -- --nocapture --test-threads=1


      - name: Real native UAX9 visual-run order and OpenType Arabic GSUB glyph-ID diagnostic
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test bidi_shaping_e2e -- --nocapture --test-threads=1

      - name: Real indexed glyph-ID GPU pixel silhouette and shaped TextInput XTest
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test shaped_gpu_e2e -- --nocapture --test-threads=1

      - name: Native BiDi editor physical arrows and disjoint selection pixel proof
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test bidi_visual_editor_e2e -- --nocapture --test-threads=1

      - name: Real explicit secondary font atlas GPU and X11 keyboard proof
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test font_fallback_e2e -- --nocapture --test-threads=1

      - name: Actual OpenType GDEF ligature ffi internal caret XTest and framebuffer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test gdef_ligature_e2e -- --nocapture --test-threads=1

      - name: Explicit adapter composition preview GPU and native XTest commit/undo proof (NOT OS XIM)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test composition_bridge_e2e -- --nocapture --test-threads=1

