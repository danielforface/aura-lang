name: Q01 Thorough SMT proof soundness
on:
  push:
    branches: ['qual/Q01-004-thorough-proof-soundness']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thorough-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Z3 solver and native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libasound2-dev cmake ninja-build pkg-config libz3-dev
      - name: Differential raw-Z3 and Aura verifier test-first
        run: cargo test -p aura-verify --locked --features z3 --test quantifier_soundness_z3 -- --nocapture
      - name: Existing real CLI typed Unsupported and normal report regressions
        run: |
          cargo test -p aura --locked --no-default-features --features z3 --test verify_report_unsupported -- --nocapture
          cargo test -p aura --locked --no-default-features --features z3 --test verify_report_status -- --nocapture
          cargo test -p aura --locked --no-default-features --features z3 --test verify_report_durability -- --nocapture
      - name: Check affected editor and verifier consumers
        run: |
          cargo check -p aura-lsp --locked
          cargo check -p aura-verify --locked --features z3
  no-z3:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libasound2-dev cmake ninja-build pkg-config
      - name: Real CLI no-Z3 fail-closed and report integrity regressions
        run: |
          cargo test -p aura --locked --no-default-features --test verify_report_status -- --nocapture
          cargo test -p aura --locked --no-default-features --test verify_fail_closed -- --nocapture
          cargo test -p aura --locked --no-default-features --test verify_report_durability -- --nocapture
