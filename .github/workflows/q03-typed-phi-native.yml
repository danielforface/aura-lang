name: Q03 SSA Phi predecessor-defined value fidelity
on:
  push:
    branches: ['qual/Q03-002-intra-branch-typed-phi']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c-native-phi-join:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native compiler prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential
          clang --version
      - name: Real predecessor-defined typed SSA Phi native execution
        run: cargo test --locked -p aura-backend-c --test phi_join_native -- --nocapture
      - name: Existing native numeric width and fail-closed regressions
        run: cargo test --locked -p aura-backend-c --test numeric_width_native -- --nocapture
      - name: Existing C backend library regressions
        run: cargo test --locked -p aura-backend-c --lib -- --nocapture
