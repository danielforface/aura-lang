name: AURA X-RAY Windows EXE

on:
  push:
    branches: [product/xray-windows-v0]
    paths:
      - "apps/xray/**"
      - ".github/workflows/xray-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-executable:
    name: Aura source to genuine Windows x64 EXE
    runs-on: windows-2022
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure native MSVC linker and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache compiler dependencies for repeatable product pulses
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Print source and compiler versions
        run: |
          Write-Host "SOURCE_SHA $env:GITHUB_SHA"
          rustc --version
          cargo --version
          clang --version

      - name: Build Aura compiler from this repo
        run: |
          cargo build -p aura --locked --no-default-features
          if ($LASTEXITCODE -ne 0) { throw "Aura compiler build failed" }
          if (!(Test-Path "target/debug/aura.exe")) { throw "Missing newly built Aura compiler" }

      - name: Compile real Aura product logic to C
        run: |
          & "target/debug/aura.exe" build apps/xray/src/analysis.aura --backend c
          if ($LASTEXITCODE -ne 0) { throw "Aura business source compilation failed" }
          if (!(Test-Path "build/analysis/module.c")) { throw "No generated module.c" }
          if (!(Test-Path "build/analysis/aura_runtime.h")) { throw "No generated aura_runtime.h" }
          $generated = Get-Content "build/analysis/module.c" -Raw
          foreach ($fn in @("xray_working_set_mib", "xray_memory_quanta_256m", "xray_io_read_quanta_64m")) {
            $signature = '(?m)\buint32_t\s+' + [regex]::Escape($fn) + '\s*\('
            if (![regex]::IsMatch($generated, $signature)) {
              throw "Aura codegen ABI regression: $fn must return real uint32_t, not void or prototype"
            }
          }

      - name: Link Aura-generated C plus restricted Win32 adapter
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $q = [char]34
          $buildInfo = "#pragma once" + [Environment]::NewLine + "#define XR_BUILD_SHA " + $q + $env:GITHUB_SHA + $q + [Environment]::NewLine
          [System.IO.File]::WriteAllText((Join-Path $PWD "apps/xray/src/build_info.h"), $buildInfo)
          $clang = (Get-Command clang.exe -ErrorAction Stop).Source
          $flags = @(
            "-std=c11", "-O2", "-Werror=implicit-function-declaration",
            "-include", "apps/xray/src/build_info.h",
            "-I", "build/analysis", "-I", "aura-stdlib/include",
            "build/analysis/module.c",
            "aura-stdlib/src/stdlib.c",
            "apps/xray/src/win32_host.c",
            "-lpsapi", "-o", "dist/AuraXRay.exe"
          )
          & $clang @flags
          if ($LASTEXITCODE -ne 0) { throw "Windows EXE linker failed: no host-only fallback" }
          if (!(Test-Path "dist/AuraXRay.exe")) { throw "EXE not produced" }

      - name: Execute generated Aura semantic vectors and real Windows capture
        run: |
          & "dist/AuraXRay.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Aura native ABI self-test failed" }
          $version = (& "dist/AuraXRay.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or !$version.Contains($env:GITHUB_SHA)) { throw "EXE provenance mismatch" }
          & "dist/AuraXRay.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "Help failed" }
          & "dist/AuraXRay.exe" --capture --seconds 2 --out "dist/ci-capture.jsonl"
          if ($LASTEXITCODE -ne 0) { throw "Live Windows process capture failed" }
          $r = @(Get-Content "dist/ci-capture.jsonl" -Encoding UTF8 | ForEach-Object { $_ | ConvertFrom-Json })
          $start = @($r | Where-Object type -eq "capture_start")
          $end = @($r | Where-Object type -eq "capture_end")
          $p = @($r | Where-Object type -eq "process")
          $samples = @($r | Where-Object type -eq "sample_end")
          if ($start.Count -ne 1 -or $end.Count -ne 1 -or $samples.Count -ne 2) { throw "Missing capture records" }
          if ($start[0].schema -ne "aura.xray.capture/1" -or $start[0].build -ne $env:GITHUB_SHA) { throw "Capture source metadata invalid" }
          if ($end[0].status -ne "complete" -or $end[0].samples -ne 2 -or $p.Count -lt 2) { throw "No complete live capture" }
          if ($end[0].elapsed_ms -lt 2000) { throw "Capture duration is less than the requested two seconds" }
          if ($end[0].monotonic_ms -le $start[0].monotonic_ms) { throw "Capture monotonic time did not progress" }
          if (($end[0].monotonic_ms - $start[0].monotonic_ms) -ne $end[0].elapsed_ms) { throw "Inconsistent capture duration counters" }
          if (!$end[0].utc) { throw "Missing capture-end UTC time" }
          if (@($p | Where-Object { $null -ne $_.working_set_kib }).Count -lt 1) { throw "No readable real process memory readings" }
          if (@($p | Where-Object { $_.PSObject.Properties.Name -contains "process_name" }).Count -gt 0) { throw "Sensitive process names exposed by default" }
          $invalid = @($p | Where-Object { $null -ne $_.memory_quanta_256m -and $null -ne $_.working_set_mib -and $_.memory_quanta_256m -ne [math]::Floor($_.working_set_mib / 256) })
          if ($invalid.Count -gt 0) { throw "Aura classification differs from observed memory band" }
          # Negative controls: reject invalid duration; never create the requested file.
          $badOutput = Join-Path $env:RUNNER_TEMP "xray-invalid-duration.jsonl"
          & "dist/AuraXRay.exe" --capture --seconds 0 --out $badOutput 2>$null
          if ($LASTEXITCODE -eq 0 -or (Test-Path $badOutput)) { throw "Zero-duration capture must fail without writing" }
          # Negative control: refuse to overwrite an existing evidence file.
          $original = (Get-FileHash "dist/ci-capture.jsonl" -Algorithm SHA256).Hash
          & "dist/AuraXRay.exe" --capture --seconds 1 --out "dist/ci-capture.jsonl" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Existing capture must not be overwritten" }
          if ((Get-FileHash "dist/ci-capture.jsonl" -Algorithm SHA256).Hash -ne $original) { throw "Evidence capture bytes changed despite overwrite refusal" }
          Write-Host "XRAY_NEGATIVE_GATES_PASS no-overwrite and invalid duration"
          Write-Host "XRAY_WINDOWS_SMOKE_PASS process_records=$($p.Count) samples=2 elapsed_ms=$($end[0].elapsed_ms)"
          # Expected failing CLI calls above have passed their negative acceptance checks.
          # pwsh preserves the last native failure exit code unless explicitly cleared.
          exit 0

      - name: Validate architecture, SHA256 and release manifest
        run: |
          $exe = [IO.File]::ReadAllBytes((Join-Path $PWD "dist/AuraXRay.exe"))
          if ($exe.Length -lt 512 -or $exe[0] -ne 77 -or $exe[1] -ne 90) { throw "Not an EXE MZ image" }
          $pe = [BitConverter]::ToInt32($exe, 60)
          if ($pe -le 0 -or $pe + 6 -gt $exe.Length) { throw "PE offset invalid" }
          if ($exe[$pe] -ne 80 -or $exe[$pe+1] -ne 69 -or $exe[$pe+2] -ne 0 -or $exe[$pe+3] -ne 0) { throw "PE signature invalid" }
          if ([BitConverter]::ToUInt16($exe, $pe + 4) -ne 0x8664) { throw "Expected x86-64 PE" }
          $sha = (Get-FileHash "dist/AuraXRay.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = "aura.xray.build-manifest/1"
            product = "AuraXRay"
            version = "0.1.1-xr01"
            source_sha = $env:GITHUB_SHA
            compiler = "aura from exact source SHA"
            backend = "aura-backend-c"
            platform = "windows-x64-pe"
            binary = "AuraXRay.exe"
            binary_sha256 = $sha
            runtime_windows_smoke = "PASS"
            signing = "UNSIGNED_EXPERIMENTAL"
            limitations = @("no GUI","no ETW","no CPU rate","no automatic fixes","no formal backend proof")
          }
          $manifest | ConvertTo-Json -Depth 7 | Set-Content "dist/BUILD-MANIFEST.json" -Encoding utf8
          Copy-Item "apps/xray/README.md" "dist/README.txt"
          Write-Host "AURA_XRAY_EXE_SHA256 $sha"

      - name: Upload deliverable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AuraXRay-windows-x64-${{ github.sha }}
          path: |
            dist/AuraXRay.exe
            dist/BUILD-MANIFEST.json
            dist/README.txt
          retention-days: 30
          if-no-files-found: error

      - name: Preserve generated Aura C on failed CI for auditable diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AuraXRay-failed-native-diagnostics-${{ github.sha }}
          path: |
            build/analysis/module.c
            build/analysis/aura_runtime.h
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload sanitized Windows test capture (CI diagnostic only)
        uses: actions/upload-artifact@v4
        with:
          name: AuraXRay-ci-capture-${{ github.sha }}
          path: dist/ci-capture.jsonl
          retention-days: 7
          if-no-files-found: error
