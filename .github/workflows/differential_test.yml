name: Backend Matrix

on:
  push:
    branches: [main]
    paths:
      - "aura/**"
      - "aura-ir/**"
      - "aura-interpret/**"
      - "aura-backend-c/**"
      - "aura-backend-llvm/**"
      - "aura-core/**"
      - "aura-ast/**"
      - "aura-parse/**"
      - ".github/workflows/differential_test.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "aura/**"
      - "aura-ir/**"
      - "aura-interpret/**"
      - "aura-backend-c/**"
      - "aura-backend-llvm/**"
      - "aura-core/**"
      - "aura-ast/**"
      - "aura-parse/**"
      - ".github/workflows/differential_test.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  crate-matrix:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - aura-ir
          - aura-interpret
          - aura-backend-c
          - aura-backend-llvm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Test backend crate
        run: cargo test -p "${{ matrix.package }}" --locked

  aura-profiles:
    name: Aura CLI build profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            cmake \
            ninja-build \
            pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check minimal Aura CLI
        run: cargo check -p aura --locked --no-default-features

      - name: Test minimal Aura CLI
        run: cargo test -p aura --locked --no-default-features

      - name: Check Aura with portable Z3
        run: cargo check -p aura --locked --no-default-features --features z3