name: XR-09 Pure Aura syntax and Lumina qualification

on:
  push:
    branches:
      - product/xray-pure-aura-v1
    paths:
      - apps/xray-pure/**
      - .github/workflows/xray-pure-aura-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-runtime:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build actual Aura AVM
        run: |
          cargo build -p aura --no-default-features --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build actual Aura' }
      - name: Qualify Aura native UI syntax without incompatible injected SDK
        run: |
          $expectedBroken=@(
            'examples/root-aura/main.aura',
            'examples/root-aura/shop_list_tool.aura',
            'apps/xray-pure/fixtures/02_import.aura',
            'apps/xray-pure/fixtures/03_layout.aura',
            'apps/xray-pure/fixtures/04_render.aura',
            'apps/xray-pure/fixtures/05_style.aura',
            'apps/xray-pure/fixtures/06_button.aura',
            'apps/xray-pure/fixtures/07_intercell_ui.aura'
          )
          $mustPass=@(
            'aura/tests/corpus/println_basic.aura',
            'apps/xray-pure/fixtures/00_cell_basic.aura',
            'apps/xray-pure/fixtures/01_cell_yield.aura',
            'apps/xray-pure/fixtures/08_nested_if.aura',
            'apps/xray-pure/fixtures/03_layout_native.aura',
            'apps/xray-pure/fixtures/04_render_native.aura',
            'apps/xray-pure/fixtures/05_style_native.aura',
            'apps/xray-pure/fixtures/06_button_native.aura',
            'apps/xray-pure/fixtures/07_intercell_ui_native.aura',
            'apps/xray-pure/fixtures/ui_smoke.aura',
            'apps/xray-pure/main.aura'
          )
          $broken=@()
          $unexpected=@()
          foreach($p in @($mustPass)+@($expectedBroken)) {
             $output=(& 'target/debug/aura.exe' check $p 2>&1 | Out-String)
             $exit=$LASTEXITCODE
             Write-Host "=== $p [exit=$exit] ==="
             Write-Host $output
             if($mustPass -contains $p){
                if($exit -eq 0){Write-Host "XR09_AURA_NATIVE_SYNTAX_PASS $p"}
                else{$unexpected+=$p;Write-Host "XR09_AURA_NATIVE_SYNTAX_FAIL $p"}
             }else{
                if($exit -ne 0){$broken+=$p;Write-Host "XR09_KNOWN_SDK_IMPORT_REJECTED $p"}
                else{Write-Host "XR09_SDK_IMPORT_NOW_ACCEPTED $p"}
             }
          }
          Write-Host "XR09_AURA_GRAMMAR_MATRIX native_pass_required=$($mustPass.Count) native_fail=$($unexpected.Count) sdk_import_rejected=$($broken.Count)"
          if($unexpected.Count){throw ("Aura-only app still fails: "+($unexpected -join ', '))}
          Write-Host 'XR09_PURE_AURA_GRAMMAR_PASS'
      - name: Diagnose full Pure Aura program (source and line)
        run: |
          Write-Host '=== AURA SOURCE WITH LINE NUMBERS ==='
          $i=0
          Get-Content 'apps/xray-pure/main.aura' | ForEach-Object { $i++; Write-Host ('{0,4}: {1}' -f $i,$_) }
          Write-Host '=== SOURCE CHECK ==='
          & 'target/debug/aura.exe' check 'apps/xray-pure/main.aura'
          if ($LASTEXITCODE -ne 0) { throw 'Pure Aura source parser or checker rejected the app' }
          Write-Host 'XR09_PURE_AURA_CHECK_PASS'
      - name: Execute independent Aura policy cell oracle
        run: |
          $env:AURA_AVM_NO_Z3='1'
          $env:AURA_UI_MAX_FRAMES='2'
          & 'target/debug/aura.exe' run 'apps/xray-pure/main.aura' --mode avm
          if ($LASTEXITCODE -ne 0) { throw 'Pure Aura actual AVM execution failed' }
          Write-Host 'XR09_PURE_AURA_AVM_PASS'
      - name: Compile actual Lumina-powered Aura runtime
        run: |
          cargo build -p aura --locked
          if ($LASTEXITCODE -ne 0) { throw 'Lumina-enabled Aura runtime failed Windows build' }
      - name: Run native Lumina Aura program with bounded frames
        run: |
          $env:AURA_AVM_NO_Z3='1'
          $env:AURA_UI_MAX_FRAMES='2'
          & 'target/debug/aura.exe' run 'apps/xray-pure/main.aura' --mode avm
          if ($LASTEXITCODE -ne 0) { throw 'Pure Aura+Lumina program failed' }
          Write-Host 'XR09_PURE_AURA_LUMINA_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: xr09-pure-aura-source-and-runtime
          path: |
            apps/xray-pure/main.aura
            apps/xray-pure/README.md
            target/debug/aura.exe
          if-no-files-found: error
