name: Release Tooling Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/release/**"
      - ".github/workflows/release-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/release/**"
      - ".github/workflows/release-validation.yml"

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-release-tool:
    name: Python release tool
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile release.py
        run: python -m py_compile tools/release/release.py

      - name: Validate release CLI
        run: python tools/release/release.py --help

  powershell-packager:
    name: PowerShell packager syntax
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse package-website.ps1
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/release/package-website.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell parser found $($errors.Count) error(s)."
          }
          Write-Host "PASS tools/release/package-website.ps1"