name: Qualification governance
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'program/aura-long-horizon-qualification-v1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-plan-and-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check plan freeze, task IDs and live documentation
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            python3 tools/qualification/check_governance.py "$PR_BASE"
          else
            python3 tools/qualification/check_governance.py
          fi
