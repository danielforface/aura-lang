name: X009 Current A and B Full Workspace Qualification
on:
  push:
    branches: [integration/x009-ab-full-qualification]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: x009-ab-full-workspace
  cancel-in-progress: true
jobs:
  full-workspace-and-trust:
    name: Exact A+B whole Cargo Workspace Z3 debug and trust
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libasound2-dev cmake ninja-build pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Fail closed on exact A ancestry B source and lock provenance
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "24db2af97dcc31045854b069c00e8c99876ceea4^{commit}"
          git merge-base --is-ancestor 24db2af97dcc31045854b069c00e8c99876ceea4 HEAD
          test "$(git rev-parse HEAD:aura-plugin-lumina)" = "45c67e712493797b296e93d228031de3eac9bc1b"
          test "$(git rev-parse HEAD:Cargo.lock)" = "bf778c997ed575e323cde39863ae8c4d3b5c5b30"
          test "$(git rev-parse HEAD:Cargo.toml)" = "6e045a697ee1645de5effca18eed76adadb28a67"
          test "$(git rev-parse HEAD:aura-nexus)" = "6065b2d92a22419b29336d77b61dd83795cf0b81"
          test "$(git rev-parse HEAD:.github/workflows/lumina-viewport-headless.yml)" = "c971644e1ba42985eb54a4cea6d415999280e23e"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          echo X009_AB_SOURCE_INTEGRITY_PASS
      - name: Regress previously broken standalone native String test with real Clang
        run: cargo test --locked -p aura-backend-c --test record_string_eq_native -- --nocapture
      - name: Run every original Cargo workspace test in no-default feature mode
        env:
          AURA_DIFFERENTIAL_REQUIRE_C: "1"
        run: cargo test --workspace --locked --no-default-features
      - name: Verify full original toolchain compatibility and trusted-core gates
        run: |
          bash tools/compat/run.sh
          bash tools/trusted-core/check.sh
      - name: Build public Aura CLI from exact combined tree
        run: cargo build --locked -p aura --no-default-features
      - name: Run corrected original Debug Rust contract and independent no-Z3 process refusal
        run: |
          cargo test --locked -p aura --no-default-features --test debug_protocol_smoke -- --nocapture
          python3 tools/integration/x006_avm_debug_contract.py --binary target/debug/aura
      - name: Compile real Z3-enabled Aura profile
        run: cargo check --locked -p aura --no-default-features --features z3
      - name: Full workspace acceptance only; not main release or deployment
        run: echo X009_AB_FULL_WORKSPACE_Z3_TRUST_COMPAT_PASS

  native-b-x11:
    name: Exact current B native X11 clipboard and privacy on A Core
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      IBUS_USE_PORTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Original native graphics and IBus packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool xclip cmake pkg-config \
            libasound2-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libgl1-mesa-dev libgl1-mesa-dri fonts-dejavu-core \
            fonts-linuxlibertine libibus-1.0-dev ibus ibus-hangul \
            fonts-nanum fonts-wqy-microhei ibus-libpinyin dbus-x11
      - uses: Swatinem/rust-cache@v2
      - name: Normal Raylib unit suite, isolate P37 diagnostic harness
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib --lib
      - name: Real X11 pointer, read-only, controlled forms and pixel tests
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test mouse_e2e -- --nocapture --test-threads=1
      - name: Real X11 keyboard, focus, drafts and policy tests
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test tab_focus_e2e -- --nocapture --test-threads=1
      - name: Real Native Lumina acceptance only, no release claim
        run: echo X009_AB_NATIVE_LUMINA_X11_PASS
