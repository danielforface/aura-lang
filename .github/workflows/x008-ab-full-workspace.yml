name: X008 B Native X11 Real Keyboard Clipboard and Forms
on:
  push:
    branches: [integration/x008-ab-full-workspace]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: x008-native-x11
  cancel-in-progress: true
jobs:
  native-lumina-x11:
    name: Exact B native X11 input, focus and forms on A source
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      IBUS_USE_PORTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native X11 and IBus integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool xclip cmake pkg-config \
            libasound2-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libgl1-mesa-dev libgl1-mesa-dri fonts-dejavu-core \
            fonts-linuxlibertine libibus-1.0-dev ibus ibus-hangul \
            fonts-nanum fonts-wqy-microhei ibus-libpinyin dbus-x11
      - uses: Swatinem/rust-cache@v2
      - name: Real Raylib standard library with isolated IBus diagnostics
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib --lib
      - name: Real X11 XTest pointer and render acceptance
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test mouse_e2e -- --nocapture --test-threads=1
      - name: Real X11 XTest keyboard Tab blur forms and routes
        run: xvfb-run -a -s "-screen 0 1280x960x24" cargo test --locked -p aura-plugin-lumina --features raylib,lumina-diagnostics --test tab_focus_e2e -- --nocapture --test-threads=1
      - name: Exact A+B X11 test success only
        run: echo X008_AB_NATIVE_X11_SUCCESS
