name: XR-09 Pure Aura syntax and Lumina qualification

on:
  push:
    branches:
      - product/xray-pure-aura-v1
    paths:
      - apps/xray-pure/**
      - .github/workflows/xray-pure-aura-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-runtime:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build actual Aura AVM
        run: |
          cargo build -p aura --no-default-features --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build actual Aura' }
      - name: Differentiate parser from UI typechecker and old SDK injection
        run: |
          $mustPass=@(
            'aura/tests/corpus/println_basic.aura',
            'apps/xray-pure/fixtures/00_cell_basic.aura',
            'apps/xray-pure/fixtures/01_cell_yield.aura',
            'apps/xray-pure/fixtures/08_nested_if.aura',
            'apps/xray-pure/policy.aura',
            'apps/xray-pure/fixtures/09_declared_ui.aura',
            'apps/xray-pure/main.aura'
          )
          $uiSyntax=@(
            'apps/xray-pure/fixtures/03_layout_native.aura',
            'apps/xray-pure/fixtures/04_render_native.aura',
            'apps/xray-pure/fixtures/05_style_native.aura',
            'apps/xray-pure/fixtures/06_button_native.aura',
            'apps/xray-pure/fixtures/07_intercell_ui_native.aura',
            'apps/xray-pure/fixtures/ui_smoke.aura'
          )
          $legacySdk=@(
            'apps/xray-pure/fixtures/02_import.aura',
            'examples/root-aura/main.aura',
            'examples/root-aura/shop_list_tool.aura'
          )
          $bad=@()
          foreach($p in @($mustPass)+@($uiSyntax)+@($legacySdk)) {
            $output=(& 'target/debug/aura.exe' check $p 2>&1 | Out-String)
            $exit=$LASTEXITCODE
            Write-Host "=== AURA $p exit=$exit ==="
            Write-Host $output
            if($mustPass -contains $p) {
              if($exit -ne 0){$bad+=$p;Write-Host "XR09_MODEL_CHECK_FAIL $p"}
              else{Write-Host "XR09_MODEL_CHECK_PASS $p"}
            } elseif($uiSyntax -contains $p) {
              if($output.Contains('parse error')) {
                $bad+=$p;Write-Host "XR09_UI_PARSER_FAIL $p"
              } elseif($exit -ne 0 -and $output.Contains("unknown callable")) {
                Write-Host "XR09_UI_PARSER_PASS_BUT_SEMA_GAP $p"
              } elseif($exit -eq 0) {
                Write-Host "XR09_UI_PARSE_AND_SEMA_PASS $p"
              } else {
                $bad+=$p;Write-Host "XR09_UNKNOWN_UI_CHECK_FAILURE $p"
              }
            } else {
              if($output.Contains('parse error')){
                Write-Host "XR09_LEGACY_SDK_IMPORT_FAIL_OBSERVED $p"
              } elseif($exit -eq 0) {
                Write-Host "XR09_LEGACY_SDK_IMPORT_RECOVERED $p"
              } else {
                $bad+=$p;Write-Host "XR09_UNKNOWN_SDK_FAILURE $p"
              }
            }
          }
          if($bad.Count){throw ("Aura parser/model regressions: "+($bad -join ', '))}
          Write-Host 'XR09_AURA_PARSER_BOUNDARY_PASS source Aura model and widget AST checked'
          # GitHub PowerShell propagates LASTEXITCODE from the final intentionally
          # rejected SDK import; reset with a real proven parser+sema pass.
          & 'target/debug/aura.exe' check 'apps/xray-pure/policy.aura'
          if($LASTEXITCODE -ne 0){throw "Policy check unexpectedly regressed"}
          Write-Host 'XR09_DIAGNOSTIC_MATRIX_STEP_PASS'
      - name: Compile actual Lumina-powered Aura runtime
        run: |
          cargo build -p aura --features z3 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Z3-enabled Aura + Lumina Windows runtime failed build' }
          Write-Host 'XR09_Z3_LUMINA_BUILD_PASS genuine Aura solver enabled'
      - name: Run actual Aura policy with full runtime verifier
        run: |
          Remove-Item Env:\AURA_AVM_NO_Z3 -ErrorAction SilentlyContinue
          $output=(& 'target/debug/aura.exe' run 'apps/xray-pure/policy.aura' --mode avm 2>&1 | Out-String)
          $code=$LASTEXITCODE
          Write-Host $output
          if(!$output.Contains('XR09_PURE_AURA_POLICY_PASS sensitive=3 standard=3 strict=2')){
            throw 'Policy mathematical oracle did not actually execute in Aura'
          }
          if($code -ne 0){throw 'Aura proof gate or runtime rejected completed mathematical oracle'}
          Write-Host 'XR09_PURE_AURA_POLICY_NATIVE_AVM_PASS'
      - name: Run actual Aura-Lumina UI with bounded frames and explicit proof status
        run: |
          Remove-Item Env:\AURA_AVM_NO_Z3 -ErrorAction SilentlyContinue
          $env:AURA_UI_MAX_FRAMES='2'
          $env:AURA_UI_DEBUG='1'
          $output=(& 'target/debug/aura.exe' run 'apps/xray-pure/main.aura' --mode avm 2>&1 | Out-String)
          $status=$LASTEXITCODE
          Write-Host $output
          if(!$output.Contains('XR09_PURE_AURA_MODEL_PASS sensitive=3 standard=3 strict=2')){
            throw 'No real UI model execution evidence from Aura'
          }
          if($status -ne 0){throw 'Real Aura GUI Z3 gate/runtime rejected source execution'}
          Write-Host 'XR09_PURE_AURA_LUMINA_PASS source and actual Z3-enabled native runtime'
      - uses: actions/upload-artifact@v4
        with:
          name: xr09-pure-aura-source-and-runtime
          path: |
            apps/xray-pure/main.aura
            apps/xray-pure/README.md
            target/debug/aura.exe
          if-no-files-found: error
