name: LSP and Debugger Compatibility

on:
  push:
    branches: [main]
    paths:
      - "aura-lsp/**"
      - "aura-ast/**"
      - "aura-lex/**"
      - "aura-parse/**"
      - "aura-core/**"
      - "aura-verify/**"
      - "aura-nexus/**"
      - ".github/workflows/ci-gate.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "aura-lsp/**"
      - "aura-ast/**"
      - "aura-lex/**"
      - "aura-parse/**"
      - "aura-core/**"
      - "aura-verify/**"
      - "aura-nexus/**"
      - ".github/workflows/ci-gate.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lsp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lsp:
    name: Aura LSP tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            libasound2-dev \
            cmake \
            ninja-build \
            pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Test Aura LSP
        run: cargo test -p aura-lsp --locked

      - name: Build LSP binaries
        run: |
          cargo build -p aura-lsp --locked --bin aura-lsp
          cargo build -p aura-lsp --locked --bin aura-ci-gate
          cargo build -p aura-lsp --locked --bin differential-test-runner

  debugger-smoke:
    name: Debugger fixture smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install debugger toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang gdb lldb

      - name: Validate debugger script
        run: bash -n aura-lsp/scripts/run_differential_tests.sh

      - name: GDB fixture smoke
        run: |
          cd aura-lsp
          bash scripts/run_differential_tests.sh gdb 45

      - name: LLDB fixture smoke
        run: |
          cd aura-lsp
          bash scripts/run_differential_tests.sh lldb 45

      - name: Upload debugger logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debugger-compatibility-logs
          path: aura-lsp/results/debugger/
          if-no-files-found: warn
          retention-days: 14