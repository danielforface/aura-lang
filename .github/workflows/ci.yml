name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  workspace:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            libasound2-dev \
            cmake \
            ninja-build \
            pkg-config

      - name: Assert supported Z3 build image and record native toolchain
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          if [[ "$ID" != "ubuntu" || "$VERSION_ID" != "24.04" ]]; then
            echo "::error::Unexpected CI image: ${PRETTY_NAME:-unknown}; Z3 0.8.1 compatibility not established"
            exit 1
          fi
          echo "AURA_CORE_CI_OS=$PRETTY_NAME"
          echo "AURA_CORE_CI_CXX=$(g++ -dumpfullversion -dumpversion)"
          echo "AURA_CORE_CI_CLANG=$(clang --version | sed -n '1p')"
          echo "AURA_CORE_CI_CMAKE=$(cmake --version | sed -n '1p')"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Validate workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Test workspace without optional default integrations
        env:
          AURA_DIFFERENTIAL_REQUIRE_C: "1"
        run: cargo test --workspace --locked --no-default-features

      - name: Verify portable Z3 feature path
        run: cargo check -p aura --locked --no-default-features --features z3

      - name: Compatibility suite
        run: bash tools/compat/run.sh

      - name: Trusted-core baseline audit
        run: bash tools/trusted-core/check.sh